# =============================================================================
# UNIX Audio Plugin - CI Test Pipeline
# =============================================================================
#
# Runs comprehensive tests on all platforms:
# - Build validation
# - Plugin validation (pluginval, clap-validator)
# - Audio quality tests
# - MIDI tests
# - Performance benchmarks
#
# Triggers on push to main/dev and all pull requests.

name: Plugin Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger
  schedule:
    # Run nightly at 3am UTC on main branch
    - cron: '0 3 * * *'

env:
  BUILD_TYPE: Release

jobs:
  # ===========================================================================
  # Build Job - Creates plugin binaries for all platforms
  # ===========================================================================
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libwebkit2gtk-4.0-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Upload CLI tools
        uses: actions/upload-artifact@v4
        with:
          name: cli-tools-${{ matrix.os }}
          path: |
            build/**/karplus-strong*
            build/**/wav-write*
            build/**/wav-read*
            build/**/sine-sweep*
          if-no-files-found: warn

      - name: Upload Plugin (VST3)
        uses: actions/upload-artifact@v4
        with:
          name: plugin-vst3-${{ matrix.os }}
          path: build/KarplusStrongPlugin_artefacts/${{ env.BUILD_TYPE }}/VST3/
          if-no-files-found: warn

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: build/KarplusStrongPlugin_artefacts/${{ env.BUILD_TYPE }}/Standalone/
          if-no-files-found: warn

  # ===========================================================================
  # Validation Job - Run pluginval on all platforms
  # ===========================================================================
  validation:
    name: Validate (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-vst3-${{ matrix.os }}
          path: plugin

      - name: Install pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip -o pluginval.zip
          unzip pluginval.zip
          chmod +x pluginval

      - name: Install pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip -o pluginval.zip
          unzip pluginval.zip

      - name: Install pluginval (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath .

      - name: Find VST3
        id: find-vst3
        shell: bash
        run: |
          VST3=$(find plugin -name "*.vst3" -type d | head -1)
          echo "vst3_path=$VST3" >> $GITHUB_OUTPUT
          echo "Found VST3: $VST3"

      - name: Run pluginval (Level 5)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "${{ steps.find-vst3.outputs.vst3_path }}"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            ./pluginval.exe --strictness-level 5 --validate "${{ steps.find-vst3.outputs.vst3_path }}"
          else
            xvfb-run ./pluginval --strictness-level 5 --validate "${{ steps.find-vst3.outputs.vst3_path }}"
          fi

      - name: Run pluginval (Level 10) - Extended
        if: github.ref == 'refs/heads/main'
        shell: bash
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 600000 --validate "${{ steps.find-vst3.outputs.vst3_path }}"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            ./pluginval.exe --strictness-level 10 --timeout-ms 600000 --validate "${{ steps.find-vst3.outputs.vst3_path }}"
          else
            xvfb-run ./pluginval --strictness-level 10 --timeout-ms 600000 --validate "${{ steps.find-vst3.outputs.vst3_path }}"
          fi

  # ===========================================================================
  # Python Tests Job - Audio quality, MIDI, performance
  # ===========================================================================
  python-tests:
    name: Python Tests (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Download CLI tools
        uses: actions/download-artifact@v4
        with:
          name: cli-tools-${{ matrix.os }}
          path: build

      - name: Download plugin
        uses: actions/download-artifact@v4
        with:
          name: plugin-vst3-${{ matrix.os }}
          path: build/KarplusStrongPlugin_artefacts/Release/VST3

      - name: Make executables runnable (Unix)
        if: runner.os != 'Windows'
        run: |
          find build -type f -name "karplus-strong" -exec chmod +x {} \;
          find build -type f -name "wav-*" -exec chmod +x {} \;
          find build -type f -name "sine-sweep" -exec chmod +x {} \;

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run validation tests
        run: pytest tests/validation -v --tb=short -m "not slow"

      - name: Run audio quality tests
        run: pytest tests/audio_quality -v --tb=short -m "not slow"
        continue-on-error: true

      - name: Run MIDI tests
        run: pytest tests/midi -v --tb=short -m "not slow"
        continue-on-error: true

      - name: Run performance tests
        run: pytest tests/performance -v --benchmark-json=benchmark-${{ matrix.os }}.json
        continue-on-error: true

      - name: Run stress tests (main branch only)
        if: github.ref == 'refs/heads/main'
        run: pytest tests/stress -v --tb=short -m "not slow"
        continue-on-error: true

      - name: Generate HTML reports
        if: always()
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'tests')
          from tools.report_generator import ReportGenerator
          gen = ReportGenerator('reports')
          gen.generate()
          print('Reports generated successfully')
          "
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: benchmark-*.json
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            reports/**/*.json
            reports/**/*.html
            reports/**/*.log
          if-no-files-found: ignore

  # ===========================================================================
  # Summary Job - Aggregate results and publish reports
  # ===========================================================================
  summary:
    name: Test Summary
    needs: [build, validation, python-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: all-reports
          merge-multiple: true

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmarks-*
          path: benchmarks
          merge-multiple: true

      - name: Aggregate reports
        run: |
          mkdir -p reports/aggregated
          # Copy all reports to aggregated directory
          cp -r all-reports/* reports/ 2>/dev/null || true
          cp benchmarks/*.json reports/performance/ 2>/dev/null || true

          # Generate combined summary
          python -c "
          import json
          import os
          from pathlib import Path

          summary = {
              'platforms': ['ubuntu-latest', 'windows-latest', 'macos-latest'],
              'reports': {}
          }

          reports_dir = Path('reports')
          for json_file in reports_dir.rglob('*.json'):
              try:
                  with open(json_file) as f:
                      data = json.load(f)
                      summary['reports'][str(json_file)] = {
                          'exists': True,
                          'keys': list(data.keys()) if isinstance(data, dict) else 'array'
                      }
              except Exception as e:
                  summary['reports'][str(json_file)] = {'error': str(e)}

          with open('reports/aggregated/summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          print('Aggregated summary created')
          "
        continue-on-error: true

      - name: Upload aggregated reports
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Check results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports" >> $GITHUB_STEP_SUMMARY
          echo "Test reports are available as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "Download 'all-test-reports' for the complete report package." >> $GITHUB_STEP_SUMMARY
