[pytest]
# =============================================================================
# Test Discovery
# =============================================================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# =============================================================================
# Markers
# =============================================================================
markers =
    validation: Plugin validation tests (pluginval, CLAP-validator)
    audio: Audio quality measurement tests (THD, SNR, frequency response)
    midi: MIDI functionality tests (notes, polyphony, timing)
    performance: Performance profiling tests (CPU, RAM, latency)
    gui: GUI automation tests (requires display)
    stress: Stress and endurance tests (long-running)
    compatibility: DAW/host compatibility tests
    slow: Long-running tests (>60s)
    quick: Fast tests (<5s)
    windows: Windows-only tests
    linux: Linux-only tests
    macos: macOS-only tests
    requires_plugin: Tests that need built plugin
    requires_standalone: Tests that need standalone app
    requires_display: Tests that need GUI display
    benchmark: Performance benchmark tests

# =============================================================================
# Default Options
# =============================================================================
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# =============================================================================
# Timeouts (seconds)
# =============================================================================
timeout = 300
timeout_method = thread

# =============================================================================
# Logging
# =============================================================================
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

log_file = reports/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# =============================================================================
# Warnings
# =============================================================================
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:librosa

# =============================================================================
# Coverage (optional)
# =============================================================================
# Uncomment if using pytest-cov
# addopts = --cov=tests --cov-report=html

# =============================================================================
# Benchmark Configuration (pytest-benchmark)
# =============================================================================
# Note: pytest-benchmark options must be passed via command line, not ini file.
# Use: pytest --benchmark-json=reports/performance/benchmark.json --benchmark-autosave
# Or set in conftest.py via pytest_configure hook.
